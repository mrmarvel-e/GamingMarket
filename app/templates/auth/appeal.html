{% extends "base.html" %}{% block title %}Ban Appeal — GamingMarket{% endblock %}{% block content %}<div class="auth"><div class="panel"><p class="eyebrow">ACCOUNT APPEAL</p><h1>Appeal a ban</h1><p class="muted">If your GamingMarket account was banned and you believe this was a mistake, submit your explanation below. Admin will review the appeal.</p><form method="post"><label>Account email<input name="email" type="email" value="{{email or request.args.get('email','')}}" required></label><label>Why should the ban be reviewed?<textarea name="message" rows="8" maxlength="5000" required placeholder="Explain what happened and why you believe the ban should be removed."></textarea></label><button class="btn full">Submit Appeal</button></form><p class="muted"><a href="{{url_for('auth.login')}}">Back to login</a></p></div></div>{% endblock %}
