{% extends "base.html" %}{% block title %}New Listing — GamingMarket{% endblock %}{% block content %}<div class="form-page"><div class="panel"><p class="eyebrow">SELL AN ACCOUNT</p><h1>Create listing</h1><p class="muted">Minimum 2 photos. Up to 10 photos.</p><form method="post" enctype="multipart/form-data"><label>Game<select id="game-select" name="game_id" required>{% for g in games %}<option value="{{g.id}}">{{g.name}}</option>{% endfor %}</select></label><div id="game-fields"></div><label>Title<input name="title" required maxlength="180"></label><label>Price (NGN)<input name="price" type="number" min="1" required></label><label>Description<textarea name="description" required></textarea></label><label>Photos<input name="photos" type="file" accept="image/*" multiple required></label><button class="btn full">Publish Listing</button></form></div></div><script>window.GM_GAMES={{ games|map(attribute='id')|list|tojson }};</script><script>window.GM_GAME_DATA={{ games|map(attribute='fields')|list|tojson }};</script><script>(function(){const s=document.querySelector('#game-select'),b=document.querySelector('#game-fields'),data=window.GM_GAME_DATA||[];function r(){b.innerHTML='';const f=data[s.selectedIndex]||{};Object.keys(f).forEach(k=>{const l=document.createElement('label');l.textContent=k.replaceAll('_',' ').replace(/\\b\\w/g,c=>c.toUpperCase());const i=document.createElement('input');i.name=k;i.placeholder=l.textContent;l.appendChild(i);b.appendChild(l)})}s.addEventListener('change',r);r()})();</script>{% endblock %}
