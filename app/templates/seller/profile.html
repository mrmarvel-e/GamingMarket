{% extends "base.html" %}{% block title %}Profile — GamingMarket{% endblock %}{% block content %}<div class="form-page"><div class="panel"><p class="eyebrow">PRIVATE PAYMENT DETAILS</p><h1>{{current_user.username}}</h1><p>Status: <strong>{{current_user.status|title}}</strong></p><form method="post"><label>Bank<input name="bank_name" value="{{current_user.bank_name or ''}}" placeholder="Bank name"></label><label>Account Name<input name="bank_account_name" value="{{current_user.bank_account_name or ''}}"></label><label>Account Number<input name="bank_account_number" value="{{current_user.bank_account_number or ''}}"></label><button class="btn full">Save Profile</button></form></div></div>{% endblock %}
