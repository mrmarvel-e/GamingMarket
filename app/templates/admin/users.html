{% extends "base.html" %}{% block title %}Users — Admin{% endblock %}{% block content %}<div class="panel"><div class="section-head"><h1>Users</h1></div>{% for u in users %}<div class="list-row"><div><strong>{{u.username}}</strong><small>{{u.email}} · {{u.status|title}}</small></div><div>{% if not u.is_admin %}{% if u.admin_verified %}<form class="inline" method="post" action="{{url_for('admin.unverify',user_id=u.id)}}"><button class="btn ghost">Remove Verified</button></form>{% else %}<form class="inline" method="post" action="{{url_for('admin.verify',user_id=u.id)}}"><button class="btn">Verify Seller</button></form>{% endif %}{% endif %}</div></div>{% endfor %}</div>{% endblock %}
